name: Rentabilidad Inmueble Android

on:
  push:
    branches:
      - feat/rentabilidad-inmueble-android
    paths:
      - "PROYECTOS_PROGRAMACION/rentabilidad-inmueble-android/**"
      - ".github/workflows/rentabilidad-inmueble-android.yml"
  pull_request:
    paths:
      - "PROYECTOS_PROGRAMACION/rentabilidad-inmueble-android/**"
      - ".github/workflows/rentabilidad-inmueble-android.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PROYECTOS_PROGRAMACION/rentabilidad-inmueble-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rentabilidad-inmueble-debug-apk
          path: PROYECTOS_PROGRAMACION/rentabilidad-inmueble-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
